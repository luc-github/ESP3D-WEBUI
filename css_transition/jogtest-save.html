<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ESP3D Jog Panel - Test SVG Interactif</title>
    <style>
        /* ========== Styles inspirés de jog-optimized.css ========== */
        .jog,
        .home,
        .scl,
        .posscl,
        .cross {
            pointer-events: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        text.jog {
            font-weight: 900;
            font-size: 11px;
            fill: black;
        }

        text.home {
            font-weight: 600;
            font-size: 16px;
        }

        text.scl {
            stroke: white;
            fill: white;
        }

        text.posscl {
            font-weight: 200;
            font-size: 8px;
            stroke: black;
            fill: black;
        }

        .std,
        .movez {
            fill: #30343a;
            stroke: #00f0ff;
            stroke-width: 1;
            filter: none;
        }

        .path.std,
        rect.std,
        path.std,
        .movez {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Ajustement visuel manuel tranche par tranche de l'écartement */
        :root {
            /* Rayons (Anneaux) */
            --scale-100: 1.04;
            --scale-10: 0.985;
            --scale-1: 0.91;
            --scale-0_1: 0.8;

            /* Écartements orthogonaux (Diagonales en croix) */
            --len-100: 1.0;
            --len-10: 1.0;
            --len-1: 1.0;
            --len-0_1: 1.0;
        }

        #Jog100, #label_circle_100 { transform-origin: 120px 120px; transform: scale(var(--scale-100)); }
        #Jog10, #label_circle_10  { transform-origin: 120px 120px; transform: scale(var(--scale-10)); }
        #Jog1, #label_circle_1   { transform-origin: 120px 120px; transform: scale(var(--scale-1)); }
        #Jog0_1, #label_circle_0_1 { transform-origin: 120px 120px; transform: scale(var(--scale-0_1)); }

        /* Le Z garde sa séparation purement rectiligne Y */
        #Z_top_100, g[id="+Z"], #sz_t_100 { transform: translateY(-7px); }
        #Z_top_10, #sz_t_10  { transform: translateY(-4px); }
        #Z_top_1, #sz_t_1   { transform: translateY(-2px); }
        #Z_top_0_1, #sz_t_0_1 { transform: translateY(0px); }
        #Z_bottom_0_1, #sz_b_0_1 { transform: translateY(0px); }
        #Z_bottom_1, #sz_b_1   { transform: translateY(2px); }
        #Z_bottom_10, #sz_b_10  { transform: translateY(4px); }
        #Z_bottom_100, g[id="-Z"], #sz_b_100 { transform: translateY(7px); }

        /* Au survol on enfle doucement vers le centre de la pièce (!fill-box rétabli juste pour l'interaction) */
        [id^="Jog1"] path.std, [id^="Jog0"] path.std,
        [id^="Z_top"] path.std, [id^="Z_bottom"] path.std {
            transform-box: fill-box;
            transform-origin: center;
            transform: scale(var(--inter-scale, 1.0));
            transition: transform 0.1s ease-out, fill 0.1s;
        }

        [id^="Jog1"] path.std:hover, [id^="Jog0"] path.std:hover,
        [id^="Z_top"] path.std:hover, [id^="Z_bottom"] path.std:hover {
            --inter-scale: 1.02; /* Gonfle discrètement au survol */
        }

        [id^="Jog1"] path.pressedbutton, [id^="Jog0"] path.pressedbutton,
        [id^="Z_top"] path.pressedbutton, [id^="Z_bottom"] path.pressedbutton {
            --inter-scale: 0.95 !important;
            fill: #118a9c !important; /* Cyan opaque très intense */
            stroke: #00f0ff !important;
            filter: none !important;
        }

        .path.std:hover,
        rect.std:hover,
        path.std:hover {
            fill: #1d6573 !important; /* Base métal teintée d'azur 100% opaque pour couper l'effet double */
            cursor: pointer;
            filter: none !important; /* Par défaut pas de glow... */
        }

        /* SAUF pour les Jogs et Z où l'Ombre Centrifuge Magique prend le dessus ! (Priorité CSS) */
        svg g[id^="V_top"] path:hover { filter: url(#shadow-top) !important; }
        svg g[id^="H_right"] path:hover { filter: url(#shadow-right) !important; }
        svg g[id^="V_bottom"] path:hover { filter: url(#shadow-bottom) !important; }
        svg g[id^="H_left"] path:hover { filter: url(#shadow-left) !important; }
        svg g[id^="Z_top"] path:hover { filter: url(#shadow-ztop) !important; }
        svg g[id^="Z_bottom"] path:hover { filter: url(#shadow-zbottom) !important; }

        circle.std,
        rect.movez {
            fill: #ef4444;
            stroke: #ef4444;
            fill-opacity: 1;
            filter: drop-shadow(0px 0px 5px rgba(239, 68, 68, 0.6));
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        circle.std:hover,
        rect.movez:hover {
            fill: #f87171 !important;
            stroke: #f87171 !important;
            cursor: pointer;
            filter: drop-shadow(0px 0px 10px #ef4444) !important;
        }

        circle.scl {
            fill: #30343a;
            fill-opacity: 1;
            stroke: #00f0ff;
            stroke-width: 1.5;
            filter: none;
        }

        circle.cross {
            stroke: black;
            fill-opacity: 0;
            stroke-width: 2;
        }

        path.home {
            stroke: black;
        }

        use[href="#HomeIcon"] {
            color: black;
        }

        #HomeX, #HomeX.std {
            filter: drop-shadow(3px 3px 4px #ffbf00) !important;
        }

        #HomeX .std {
            fill: #30343a !important; /* Gris métal très foncé */
            stroke: #ffbf00 !important;
            filter: none !important;
        }

        #HomeX:hover .std, #HomeX .std:hover {
            fill: #454a52 !important;
        }

        #HomeX text.home {
            fill: transparent !important;
            stroke: #ffbf00 !important;
            stroke-width: 0.8px;
            filter: drop-shadow(0px 0px 4px #ffbf00) !important;
        }

        #HomeX use {
            --icon-fill: transparent;
            --icon-stroke: #ffbf00;
            filter: drop-shadow(0px 0px 4px #ffbf00) !important;
        }

        #HomeX {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #HomeX:has(.pressedbutton) {
            transform: translate(5px, 5px);
        }

        #HomeX .pressedbutton {
            fill: rgba(255, 191, 0, 0.2) !important;
            stroke: #ffbf00 !important;
        }

        /* ========== Home Y ========== */
        #HomeY, #HomeY.std {
            filter: drop-shadow(-3px 3px 4px #00f0ff) !important;
        }

        #HomeY .std {
            fill: #30343a !important;
            stroke: #00f0ff !important;
            filter: none !important;
        }

        #HomeY:hover .std, #HomeY .std:hover {
            fill: #454a52 !important;
        }

        #HomeY text.home {
            fill: transparent !important;
            stroke: #00f0ff !important;
            stroke-width: 0.8px;
            filter: drop-shadow(0px 0px 4px #00f0ff) !important;
        }

        #HomeY use {
            --icon-fill: transparent;
            --icon-stroke: #00f0ff;
            filter: drop-shadow(0px 0px 4px #00f0ff) !important;
        }

        #HomeY {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #HomeY:has(.pressedbutton) {
            transform: translate(-5px, 5px);
        }

        #HomeY .pressedbutton {
            fill: rgba(0, 240, 255, 0.2) !important;
            stroke: #00f0ff !important;
        }

        /* ========== Home All (Bottom Left) ========== */
        #HomeAll, #HomeAll.std {
            filter: drop-shadow(3px -3px 4px #00ff66) !important;
        }

        #HomeAll .std {
            fill: #30343a !important;
            stroke: #00ff66 !important;
            filter: none !important;
        }

        #HomeAll:hover .std, #HomeAll .std:hover {
            fill: #454a52 !important;
        }

        #HomeAll use {
            --icon-fill: transparent;
            --icon-stroke: #00ff66;
            filter: drop-shadow(0px 0px 4px #00ff66) !important;
        }

        #HomeAll {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #HomeAll:has(.pressedbutton) {
            transform: translate(5px, -5px);
        }

        #HomeAll .pressedbutton {
            fill: rgba(0, 255, 102, 0.2) !important;
            stroke: #00ff66 !important;
        }

        /* ========== Home Z (Bottom Right) ========== */
        #HomeZ, #HomeZ.std {
            filter: drop-shadow(-3px -3px 4px #ff00ff) !important;
        }

        #HomeZ .std {
            fill: #30343a !important;
            stroke: #ff00ff !important;
            filter: none !important;
        }

        #HomeZ:hover .std, #HomeZ .std:hover {
            fill: #454a52 !important;
        }

        #HomeZ text.home {
            fill: transparent !important;
            stroke: #ff00ff !important;
            stroke-width: 0.8px;
            filter: drop-shadow(0px 0px 4px #ff00ff) !important;
        }

        #HomeZ use {
            --icon-fill: transparent;
            --icon-stroke: #ff00ff;
            filter: drop-shadow(0px 0px 4px #ff00ff) !important;
        }

        #HomeZ {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #HomeZ:has(.pressedbutton) {
            transform: translate(-5px, -5px);
        }

        #HomeZ .pressedbutton {
            fill: rgba(255, 0, 255, 0.2) !important;
            stroke: #ff00ff !important;
        }

        /* ========== Arrows & Labels ========== */
        .arrowX, .labelX {
            stroke: #ffbf00 !important;
            filter: drop-shadow(0px 0px 4px #ffbf00) !important;
        }
        .arrowX {
            stroke-width: 1px;
            fill: rgba(255, 191, 0, 0.2) !important;
        }
        .labelX { fill: transparent !important; }

        .arrowY, .labelY {
            stroke: #00f0ff !important;
            filter: drop-shadow(0px 0px 4px #00f0ff) !important;
        }
        .arrowY {
            stroke-width: 1px;
            fill: rgba(0, 240, 255, 0.2) !important;
        }
        .labelY { fill: transparent !important; }

        .arrowZ, .labelZ {
            stroke: #ff00ff !important;
            filter: drop-shadow(0px 0px 4px #ff00ff) !important;
        }
        .arrowZ {
            stroke-width: 1px;
            fill: rgba(255, 0, 255, 0.2) !important;
        }
        .labelZ { fill: transparent !important; }

        .pressedbutton {
            fill: #ff7c26 !important;
            stroke: black;
            stroke-width: 1;
            cursor: pointer;
        }

        /* Styles pour la page de test */
        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e2f;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .test-container {
            background: #2d2d3a;
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3);
            max-width: 1300px;
            width: 100%;
        }

        .svg-wrapper {
            background: #000000;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            box-shadow: inset 0 0 5px rgba(0, 240, 255, 0.5);
        }

        .controls-panel {
            background: #252530;
            padding: 1rem;
            border-radius: 12px;
            margin-top: 20px;
            color: #eee;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }

        .config-group {
            background: #1e1e28;
            border-radius: 8px;
            padding: 10px 15px;
            flex: 1;
            min-width: 180px;
        }

        .config-group h4 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            border-left: 3px solid #f0a500;
            padding-left: 8px;
        }

        .config-group label {
            display: block;
            margin: 6px 0;
            font-size: 0.85rem;
        }

        input,
        select {
            background: #333;
            border: 1px solid #555;
            color: #eee;
            padding: 4px 8px;
            border-radius: 5px;
            width: 100px;
            margin-left: 8px;
        }

        button {
            background: #f0a500;
            border: none;
            color: #1e1e2f;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }

        button:hover {
            background: #ffb82e;
        }

        .log-area {
            background: #0f0f17;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            border-radius: 8px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .clear-log {
            background: #555;
            color: white;
            padding: 2px 12px;
            font-size: 0.7rem;
        }

        hr {
            border-color: #444;
        }
    </style>
</head>

<body>
    <!-- Outil d'ajustement dynamique des écarts Jogs -->
    <div style="position: fixed; top: 20px; right: 20px; background: rgba(30, 30, 40, 0.95); border: 1px solid #00f0ff; box-shadow: 0 0 10px #00f0ff; padding: 15px; border-radius: 8px; z-index: 1000; font-family: sans-serif; font-size: 13px; color: #fff; display: flex; gap: 20px;">
        <div>
            <h4 style="margin: 0 0 10px 0; color: #00f0ff;">Rayon (Anneaux)</h4>
            <label style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                Jog 100 <input id="tweak-100" type="range" min="0.80" max="1.1" step="0.005" value="1.04" style="margin: 0 10px;"> <span id="tw-val-100" style="width: 35px; text-align:right;">1.04</span>
            </label>
            <label style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                Jog 10 <input id="tweak-10" type="range" min="0.80" max="1.1" step="0.005" value="0.985" style="margin: 0 10px;"> <span id="tw-val-10" style="width: 35px; text-align:right;">0.985</span>
            </label>
            <label style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                Jog 1  <input id="tweak-1" type="range" min="0.80" max="1.1" step="0.005" value="0.91" style="margin: 0 10px;"> <span id="tw-val-1" style="width: 35px; text-align:right;">0.91</span>
            </label>
            <label style="display: flex; justify-content: space-between;">
                Jog 0.1 <input id="tweak-01" type="range" min="0.80" max="1.1" step="0.005" value="0.80" style="margin: 0 10px;"> <span id="tw-val-01" style="width: 35px; text-align:right;">0.80</span>
            </label>
        </div>
        <div>
            <h4 style="margin: 0 0 10px 0; color: #00f0ff;">Écartement Diagonales (Pixels)</h4>
            <label style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                Jog 100 <input id="gap-100" type="range" min="0" max="25" step="0.5" value="10" style="margin: 0 10px;"> <span id="g-val-100" style="width: 35px; text-align:right;">10</span>
            </label>
            <label style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                Jog 10 <input id="gap-10" type="range" min="0" max="25" step="0.5" value="10" style="margin: 0 10px;"> <span id="g-val-10" style="width: 35px; text-align:right;">10</span>
            </label>
            <label style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                Jog 1  <input id="gap-1" type="range" min="0" max="25" step="0.5" value="10" style="margin: 0 10px;"> <span id="g-val-1" style="width: 35px; text-align:right;">10</span>
            </label>
            <label style="display: flex; justify-content: space-between;">
                Jog 0.1 <input id="gap-01" type="range" min="0" max="25" step="0.5" value="10" style="margin: 0 10px;"> <span id="g-val-01" style="width: 35px; text-align:right;">10</span>
            </label>
        </div>
    </div>

    <div class="test-container">
        <div class="svg-wrapper">
            <!-- SVG complet avec IDs et classes, adapté pour le test -->
            <svg viewBox="0 -5 325 255" xmlns="http://www.w3.org/2000/svg" version="1.1" class="jog-svg">
                <defs>
                    <filter id="f1" x="-1" y="-1" width="300%" height="300%">
                        <feOffset result="offOut" in="SourceAlpha" dx="3" dy="3" />
                        <feGaussianBlur result="blurOut" in="offOut" stdDeviation="3" />
                        <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
                    </filter>
                    <!-- Filtres natifs étendus empêchant le "clipping" d'ombre lié aux transform-box -->
                    <filter id="shadow-top" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="-5" stdDeviation="8" flood-color="#00f0ff" flood-opacity="1" />
                    </filter>
                    <filter id="shadow-right" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="5" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="1" />
                    </filter>
                    <filter id="shadow-bottom" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#00f0ff" flood-opacity="1" />
                    </filter>
                    <filter id="shadow-left" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="-5" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="1" />
                    </filter>
                    <filter id="shadow-ztop" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="5" dy="-5" stdDeviation="8" flood-color="#00f0ff" flood-opacity="1" />
                    </filter>
                    <filter id="shadow-zbottom" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="5" dy="5" stdDeviation="8" flood-color="#00f0ff" flood-opacity="1" />
                    </filter>
                    <symbol id="HomeIcon" viewBox="0 0 20 18">
                        <path d="M3,18 v-8 l7,-6 l7,6 v8 h-5 v-6 h-4 v6 z" fill="var(--icon-fill, currentColor)" stroke="var(--icon-stroke, none)" stroke-width="1" />
                        <path d="M0,10 l10-8.5 l10,8.5" stroke-width="1.5" fill="none" stroke="var(--icon-stroke, currentColor)" />
                        <path d="M15,3 v2.8 l1,.8 v-3.6 z" fill="var(--icon-fill, currentColor)" stroke="var(--icon-stroke, none)" stroke-width="1" />
                    </symbol>
                </defs>

                <!-- Home buttons -->
                <g id="HomeAll" class="std">
                    <title>Home All axes</title>
                    <path class="std" d="M10 182.5 h-10 v57.5 h57.5 v-10 a 125,125 0 0,1 -47.5 -47.5 Z" />
                    <use x="3" y="217" width="20" height="18" href="#HomeIcon" />
                </g>

                <g id="HomeX" class="std">
                    <title>Home X</title>
                    <path class="std" d="M10 57.5 h-10 v-57.5 h57.5 v10 a125,125 0 0,0 -47.5 47.5Z" />
                    <use x="3" y="5" width="20" height="18" href="#HomeIcon" />
                    <text x="25" y="20" class="home">X</text>
                </g>

                <g id="HomeY" class="std">
                    <title>Home Y</title>
                    <path class="std" d="M230 57.5 h10 v-57.5 h-57.5 v10 a125,125 0 0,1 47.5 47.5z" />
                    <use x="217" y="5" width="20" height="18" href="#HomeIcon" />
                    <text x="202" y="20" class="home">Y</text>
                </g>

                <g id="HomeZ" class="std">
                    <title>Home Z</title>
                    <path class="std" d="M230 182.5 h10 v57.5 h-57.5 v-10 a125,125 0 0,0 47.5 -47.5z" />
                    <use x="217" y="217" width="20" height="18" href="#HomeIcon" />
                    <text x="202" y="232" class="home">Z</text>
                </g>

                <!-- Jog circles -->
                <g id="Jog100" fill="#c0c0c0" class="std">
                    <g id="V_top_100" transform="translate(120 120)">
                        <path class="std"
                            d="M-60 -67.07 L-75.93,-83 A112.5,112.5 0 0,1 75,-83 L60,-67.07 A90,90 0 0,0 -60,-67.07 z" />
                    </g>
                    <g id="H_right_100" transform="translate(120 120)">
                        <path class="std"
                            d="M67.07,-60 L83,-75.93 A112.5,112.5 0 0,1 83,75.93 L67.07,60 A90,90 0 0,0 67.07,-60" />
                    </g>
                    <g id="V_bottom_100" transform="translate(120 120)">
                        <path class="std"
                            d="M-60,67.07 L-75.93,83 A112.5,112.5 0 0,0 75,83 L60,67.07 A90,90 0 0,1 -60,67.07 z" />
                    </g>
                    <g id="H_left_100" transform="translate(120 120)">
                        <path class="std"
                            d="M-67.07,-60 L-83,-75.93 A112.5,112.5 0 0,0 -83,75.93 L-67.07,60 A90,90 0 0,1 -67.07,-60 z" />
                    </g>
                </g>

                <g id="Jog10" fill="#d0d0d0" class="std">
                    <g id="V_top_10" transform="translate(120 120)">
                        <path class="std"
                            d="M-44.06 -51.13 L-60,-67.07 A90,90 0 0,1 60,-67 L44.06,-51.13 A67.5,67.5 0 0,0 -44.06,-51.13 z" />
                    </g>
                    <g id="H_right_10" transform="translate(120 120)">
                        <path class="std"
                            d="M51.13 44.06 L67.07,60 A90,90 0 0,0 67.07,-60 L51.13,-44.06 A67.5,67.5 0 0,1 51.13,44.06 z" />
                    </g>
                    <g id="V_bottom_10" transform="translate(120 120)">
                        <path class="std"
                            d="M-44.06 51.13 L-60,67.07 A90,90 0 0,0 60,67 L44.06,51.13 A67.5,67.5 0 0,1 -44.06,51.13 z" />
                    </g>
                    <g id="H_left_10" transform="translate(120 120)">
                        <path class="std"
                            d="M-51.13 44.06 L-67.07,60 A90,90 0 0,1 -67.07,-60 L-51.13,-44.06 A67.5,67.5 0 0,0 -51.13,44.06 z" />
                    </g>
                </g>

                <g id="Jog1" fill="#e0e0e0" class="std">
                    <g id="V_top_1" transform="translate(120 120)">

        <div class="controls-panel">
            <div class="config-group">
                <h4>🔄 Orientation axes</h4>
                <label><input type="checkbox" id="swapXY"> Swap X/Y</label>
                <label><input type="checkbox" id="invertX"> Inverser X</label>
                <label><input type="checkbox" id="invertY"> Inverser Y</label>
                <label><input type="checkbox" id="invertZ"> Inverser Z</label>
                <button id="refreshAxes">Appliquer orientation</button>
            </div>
            <div class="config-group">
                <h4>⚙️ Feedrate & Positions</h4>
                <label>XY Feedrate: <input type="number" id="xyFeed" value="1000" step="50"></label>
                <label>Z Feedrate: <input type="number" id="zFeed" value="500" step="50"></label>
                <label>MoveTo X: <input type="number" id="moveX" value="0" step="1"></label>
                <label>MoveTo Y: <input type="number" id="moveY" value="0" step="1"></label>
                <label>MoveTo Z: <input type="number" id="moveZ" value="0" step="1"></label>
            </div>
            <div class="config-group">
                <h4>📦 Pas de jog (mm)</h4>
                <label>Step X: <input type="number" id="stepX" value="1" step="0.1" min="0.01"></label>
                <label>Step Y: <input type="number" id="stepY" value="1" step="0.1" min="0.01"></label>
                <label>Step Z: <input type="number" id="stepZ" value="1" step="0.1" min="0.01"></label>
            </div>
        </div>

        <div class="log-area">
            <div class="log-header">
                <span>📡 Console de commandes (simulation)</span>
                <button class="clear-log" id="clearLog">Effacer logs</button>
            </div>
            <div id="logMessages"></div>
        </div>
    </div>

    <script>
        // Variables globales de configuration (copie de la logique Jog.js)
        let H_axis = "X";
        let V_axis = "Y";
        let H_axis_left_dir = "-";
        let H_axis_right_dir = "+";
        let V_axis_top_dir = "+";
        let V_axis_bottom_dir = "-";
        let Z_axis = "Z";
        let Z_axis_top_dir = "-";
        let Z_axis_bottom_dir = "+";

        // Feedrates et positions cibles
        let currentFeedRate = { xyfeedrate: 1000, zfeedrate: 500 };
        let movetoX = 0, movetoY = 0, movetoZ = 0;

        // Pas de jog (valeurs par défaut)
        let jogAxisStep = { X: 1, Y: 1, Z: 1 };

        let currentButtonPressed = null;

        // Helper pour log dans la console et dans le panneau
        function addLog(message) {
            console.log(message);
            const logDiv = document.getElementById('logMessages');
            const entry = document.createElement('div');
            entry.textContent = `> ${new Date().toLocaleTimeString()} : ${message}`;
            logDiv.appendChild(entry);
            entry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function clearLog() {
            document.getElementById('logMessages').innerHTML = '';
            addLog('Log effacé.');
        }

        // Envoi simulé de commande
        function SendCommand(cmd) {
            addLog(`📨 COMMANDE : ${cmd}`);
        }

        // Home
        function sendHomeCommand(axis, id) {
            const homeCmd = axis ? `G28 ${axis}` : "G28";
            addLog(`🏠 HOME ${axis || 'ALL'} → ${homeCmd}`);
            onOut(id);
            if (id && currentButtonPressed !== id) return;
            SendCommand(homeCmd);
        }

        // Jog
        function sendJogCommand(axis, id, distance) {
            let movement;
            let feedrate = axis.startsWith("Z") ? currentFeedRate.zfeedrate : currentFeedRate.xyfeedrate;
            if (distance) {
                movement = axis + distance;
            } else {
                let step = axis.startsWith("Z") ? jogAxisStep.Z : (axis.startsWith("Y") ? jogAxisStep.Y : jogAxisStep.X);
                movement = axis + (step || 1);
            }
            const cmd = `G91\nG1 ${movement} F${feedrate}\nG90`;
            addLog(`🕹️ JOG ${movement} (F${feedrate}) → ${cmd.replace(/\n/g, ' ; ')}`);
            onOut(id);
            if (id && currentButtonPressed !== id) return;
            SendCommand(cmd);
        }

        // Move to position (centre XY ou Z)
        function sendMoveCommand(buttonId, id) {
            onOut(buttonId);
            if (id && currentButtonPressed !== id) return;
            let cmd;
            if (buttonId === "posxy") {
                cmd = `G1 X${movetoX} Y${movetoY} F${currentFeedRate.xyfeedrate}`;
                addLog(`🎯 Move to XY (${movetoX},${movetoY}) → ${cmd}`);
            } else {
                cmd = `G1 Z${movetoZ} F${currentFeedRate.zfeedrate}`;
                addLog(`🎯 Move to Z=${movetoZ} → ${cmd}`);
            }
            SendCommand(cmd);
        }

        // UI pressed visual
        function onMouseDown(id) {
            currentButtonPressed = id;
            const el = document.getElementById(id);
            if (el) {
                const targetElem = id === "posz" ? el.querySelector(".movez") : el.querySelector(".std");
                if (targetElem) {
                    targetElem.classList.add("pressedbutton");
                    if (id === "posz") targetElem.classList.remove("movez");
                    else targetElem.classList.remove("std");
                }
            }
        }

        function onOut(id) {
            const el = document.getElementById(id);
            if (el) {
                const pressed = el.querySelector(".pressedbutton");
                if (pressed) {
                    if (id === "posz") pressed.classList.add("movez");
                    else pressed.classList.add("std");
                    pressed.classList.remove("pressedbutton");
                }
            }
        }

        function onHoverJog(labelId) {
            const lbl = document.getElementById(labelId);
            if (lbl) lbl.style.opacity = "1";
        }

        function onOutJog(labelId, buttonId) {
            const lbl = document.getElementById(labelId);
            if (lbl) lbl.style.opacity = "0.2";
            onOut(buttonId);
        }

        // Mise à jour des directions et labels SVG selon paramètres utilisateur
        function updateAxesAndLabels() {
            const swap = document.getElementById('swapXY').checked;
            const invX = document.getElementById('invertX').checked;
            const invY = document.getElementById('invertY').checked;
            const invZ = document.getElementById('invertZ').checked;

            if (swap) {
                H_axis = "Y";
                V_axis = "X";
            } else {
                H_axis = "X";
                V_axis = "Y";
            }

            // Directions horizontales (H)
            if (invX) {
                if (swap) {
                    H_axis_left_dir = "+";
                    H_axis_right_dir = "-";
                } else {
                    H_axis_left_dir = "+";
                    H_axis_right_dir = "-";
                }
            } else {
                if (swap) {
                    H_axis_left_dir = "-";
                    H_axis_right_dir = "+";
                } else {
                    H_axis_left_dir = "-";
                    H_axis_right_dir = "+";
                }
            }

            // Directions verticales (V)
            if (invY) {
                if (swap) {
                    V_axis_top_dir = "-";
                    V_axis_bottom_dir = "+";
                } else {
                    V_axis_top_dir = "-";
                    V_axis_bottom_dir = "+";
                }
            } else {
                if (swap) {
                    V_axis_top_dir = "+";
                    V_axis_bottom_dir = "-";
                } else {
                    V_axis_top_dir = "+";
                    V_axis_bottom_dir = "-";
                }
            }

            // Z inversions
            if (invZ) {
                Z_axis_top_dir = "+";
                Z_axis_bottom_dir = "-";
            } else {
                Z_axis_top_dir = "-";
                Z_axis_bottom_dir = "+";
            }

            // Mise à jour des textes SVG
            document.getElementById('labelHLeft').textContent = H_axis_left_dir + H_axis;
            document.getElementById('labelHRight').textContent = H_axis_right_dir + H_axis;
            document.getElementById('labelVTop').textContent = V_axis_top_dir + V_axis;
            document.getElementById('labelVBottom').textContent = V_axis_bottom_dir + V_axis;
            document.getElementById('labelZTop').textContent = Z_axis_top_dir + Z_axis;
            document.getElementById('labelZBottom').textContent = Z_axis_bottom_dir + Z_axis;

            // Mise à jour des titres des centres (moveTo positions)
            document.getElementById('posxyTitle').textContent = `Move to X${movetoX} Y${movetoY}`;
            document.getElementById('poszTitle').textContent = `Move to Z${movetoZ}`;

            // Re-attacher events ? Non, les handlers utilisent les variables globales mises à jour, donc les prochains clics utiliseront les nouvelles directions.
            addLog(`Orientation appliquée : H=${H_axis_left_dir}${H_axis}/${H_axis_right_dir}${H_axis} | V=${V_axis_top_dir}${V_axis}/${V_axis_bottom_dir}${V_axis} | Z=${Z_axis_top_dir}${Z_axis}/${Z_axis_bottom_dir}${Z_axis}`);
        }

        // Mise à jour des feedrates / positions depuis les inputs
        function updateSettings() {
            currentFeedRate.xyfeedrate = parseFloat(document.getElementById('xyFeed').value) || 1000;
            currentFeedRate.zfeedrate = parseFloat(document.getElementById('zFeed').value) || 500;
            movetoX = parseFloat(document.getElementById('moveX').value) || 0;
            movetoY = parseFloat(document.getElementById('moveY').value) || 0;
            movetoZ = parseFloat(document.getElementById('moveZ').value) || 0;
            jogAxisStep.X = parseFloat(document.getElementById('stepX').value) || 1;
            jogAxisStep.Y = parseFloat(document.getElementById('stepY').value) || 1;
            jogAxisStep.Z = parseFloat(document.getElementById('stepZ').value) || 1;
            document.getElementById('posxyTitle').textContent = `Move to X${movetoX} Y${movetoY}`;
            document.getElementById('poszTitle').textContent = `Move to Z${movetoZ}`;
            addLog(`Paramètres : XY feed=${currentFeedRate.xyfeedrate}, Z feed=${currentFeedRate.zfeedrate}, MoveTo (${movetoX},${movetoY},${movetoZ}), Steps (${jogAxisStep.X},${jogAxisStep.Y},${jogAxisStep.Z})`);
        }

        // Attacher tous les événements aux éléments SVG
        function attachEvents() {
            // helpers d'attachement avec Pointer Events pour éviter les bugs CSS transform
            const attach = (id, handlers) => {
                const el = document.getElementById(id);
                if (!el) return;
                
                if (handlers.down) {
                    el.addEventListener('pointerdown', (e) => {
                        // Verrouille le pointeur pour éviter de perdre le clic en bougeant
                        el.setPointerCapture(e.pointerId);
                        handlers.down();
                    });
                }
                if (handlers.up) {
                    el.addEventListener('pointerup', (e) => {
                        try { el.releasePointerCapture(e.pointerId); } catch(err) {}
                        handlers.up();
                    });
                }
                if (handlers.out) {
                    el.addEventListener('pointerleave', handlers.out);
                    el.addEventListener('pointercancel', handlers.out);
                }
                if (handlers.over) {
                    el.addEventListener('pointerenter', handlers.over);
                }
            };

            // Home
            attach("HomeAll", { down: () => onMouseDown("HomeAll"), up: () => sendHomeCommand("", "HomeAll"), out: () => onOut("HomeAll") });
            attach("HomeX", { down: () => onMouseDown("HomeX"), up: () => sendHomeCommand("X", "HomeX"), out: () => onOut("HomeX") });
            attach("HomeY", { down: () => onMouseDown("HomeY"), up: () => sendHomeCommand("Y", "HomeY"), out: () => onOut("HomeY") });
            attach("HomeZ", { down: () => onMouseDown("HomeZ"), up: () => sendHomeCommand("Z", "HomeZ"), out: () => onOut("HomeZ") });

            // Jog circles avec taille et direction dynamiques
            const jogSizes = ['100', '10', '1', '0_1'];
            const getDirections = () => [
                { prefix: 'V_top', axis: V_axis, dist: (s) => V_axis_top_dir + s.replace('_', '.') },
                { prefix: 'H_right', axis: H_axis, dist: (s) => H_axis_right_dir + s.replace('_', '.') },
                { prefix: 'V_bottom', axis: V_axis, dist: (s) => V_axis_bottom_dir + s.replace('_', '.') },
                { prefix: 'H_left', axis: H_axis, dist: (s) => H_axis_left_dir + s.replace('_', '.') },
            ];

            function refreshJogEvents() {
                // On retire d'abord les anciens pour éviter les doublons (simple: on supprime tous les écouteurs connus? on peut réattacher en boucle en les remplaçant)
                // Pour la simplicité, on va détruire et réattacher par clonage ou on utilise une approche avec des closures? 
                // Méthode: pour chaque élément, on clone et remplace pour reset les events.
                const elementsToRefresh = [];
                jogSizes.forEach(size => {
                    getDirections().forEach(dir => {
                        elementsToRefresh.push(`${dir.prefix}_${size}`);
                    });
                });
                elementsToRefresh.forEach(id => {
                    const old = document.getElementById(id);
                    if (old) {
                        const clone = old.cloneNode(true);
                        old.parentNode.replaceChild(clone, old);
                    }
                });
                // puis réattacher
                jogSizes.forEach(size => {
                    getDirections().forEach(dir => {
                        const btnId = `${dir.prefix}_${size}`;
                        const labelId = size === '0_1' ? 'label_circle_0_1' : `label_circle_${size}`;
                        attach(btnId, {
                            down: () => onMouseDown(btnId),
                            up: () => sendJogCommand(dir.axis, btnId, dir.dist(size)),
                            out: () => onOutJog(labelId, btnId),
                            over: () => onHoverJog(labelId)
                        });
                    });
                });
            }

            // Z bar
            const zDirections = [
                { id: 'Z_top_100', dist: () => Z_axis_top_dir + '100' },
                { id: 'Z_top_10', dist: () => Z_axis_top_dir + '10' },
                { id: 'Z_top_1', dist: () => Z_axis_top_dir + '1' },
                { id: 'Z_top_0_1', dist: () => Z_axis_top_dir + '0.1' },
                { id: 'Z_bottom_0_1', dist: () => Z_axis_bottom_dir + '0.1' },
                { id: 'Z_bottom_1', dist: () => Z_axis_bottom_dir + '1' },
                { id: 'Z_bottom_10', dist: () => Z_axis_bottom_dir + '10' },
                { id: 'Z_bottom_100', dist: () => Z_axis_bottom_dir + '100' },
            ];

            function refreshZEvents() {
                zDirections.forEach(z => {
                    const labelId = z.id.includes('100') ? 'z100' : (z.id.includes('10') ? 'z10' : (z.id.includes('1') && !z.id.includes('0_1') ? 'z1' : 'z0_1'));
                    attach(z.id, {
                        down: () => onMouseDown(z.id),
                        up: () => sendJogCommand(Z_axis, z.id, z.dist()),
                        out: () => onOutJog(labelId, z.id),
                        over: () => onHoverJog(labelId)
                    });
                });
            }

            // Centre XY et Z
            attach("posxy", { down: () => onMouseDown("posxy"), up: () => sendMoveCommand("posxy", "posxy"), out: () => onOut("posxy"), over: () => onHoverJog("posxy") });
            attach("posz", { down: () => onMouseDown("posz"), up: () => sendMoveCommand("posz", "posz"), out: () => onOut("posz"), over: () => onHoverJog("posz") });

            refreshJogEvents();
            refreshZEvents();

            // Stocker les fonctions pour mise à jour lors du changement d'axes
            window.refreshAllEvents = () => {
                refreshJogEvents();
                refreshZEvents();
            };
        }

        // Initialisation
        function init() {
            updateSettings();
            updateAxesAndLabels();
            attachEvents();

            // Écouteurs des paramètres
            document.getElementById('refreshAxes').addEventListener('click', () => {
                updateAxesAndLabels();
                window.refreshAllEvents();
            });
            document.getElementById('clearLog').addEventListener('click', clearLog);
            const inputs = ['xyFeed', 'zFeed', 'moveX', 'moveY', 'moveZ', 'stepX', 'stepY', 'stepZ'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('change', updateSettings);
                document.getElementById(id).addEventListener('input', updateSettings);
            });

            addLog("✅ Interface de test SVG chargée – toutes les commandes sont simulées dans la console et ici.");

            // Logique pour le panel Tweak Ecarts JOG en live
            const tw100 = document.getElementById('tweak-100');
            const tw10 = document.getElementById('tweak-10');
            const tw1 = document.getElementById('tweak-1');
            const tw01 = document.getElementById('tweak-01');
            const rootStyle = document.documentElement.style;

            tw100.addEventListener('input', (e) => {
                rootStyle.setProperty('--scale-100', e.target.value);
                document.getElementById('tw-val-100').innerText = e.target.value;
            });
            tw10.addEventListener('input', (e) => {
                rootStyle.setProperty('--scale-10', e.target.value);
                document.getElementById('tw-val-10').innerText = e.target.value;
            });
            tw1.addEventListener('input', (e) => {
                rootStyle.setProperty('--scale-1', e.target.value);
                document.getElementById('tw-val-1').innerText = e.target.value;
            });
            tw01.addEventListener('input', (e) => {
                rootStyle.setProperty('--scale-0_1', e.target.value);
                document.getElementById('tw-val-01').innerText = e.target.value;
            });

            // Moteur géométrique temporel réel (calcul de l’intersection Lignes / Cercles)
            const gap100 = document.getElementById('gap-100');
            const gap10 = document.getElementById('gap-10');
            const gap1 = document.getElementById('gap-1');
            const gap01 = document.getElementById('gap-01');

            function redrawJogWedges() {
                const rings = [
                    { id: "100", Rin: 90, Rout: 112.5 },
                    { id: "10",  Rin: 67.5, Rout: 90 },
                    { id: "1",   Rin: 45, Rout: 67.5 },
                    { id: "0_1", Rin: 22.5, Rout: 45 }
                ];

                rings.forEach(ring => {
                    let rawVal = document.getElementById('gap-' + ring.id.replace('_', ''))?.value || "10";
                    let w = parseFloat(rawVal) / 2; // w est l'écart mathématique physique
                    let K = w * Math.SQRT2;

                    function calcPts(R) {
                        let inner = 2 * R * R - K * K;
                        if (inner < 0) inner = 0;
                        let disc = Math.sqrt(inner);
                        return { xL: (K - disc) / 2, yL: (-K - disc) / 2, xR: (-K + disc) / 2, yR: (-K - disc) / 2 };
                    }

                    function buildD(fnMap) {
                        let pO = calcPts(ring.Rout);
                        let pI = calcPts(ring.Rin);
                        let L1 = fnMap(pI.xL, pI.yL);
                        let L2 = fnMap(pO.xL, pO.yL);
                        let L3 = fnMap(pO.xR, pO.yR);
                        let L4 = fnMap(pI.xR, pI.yR);
                        return `M${L1.x.toFixed(2)} ${L1.y.toFixed(2)} L${L2.x.toFixed(2)} ${L2.y.toFixed(2)} A${ring.Rout},${ring.Rout} 0 0,1 ${L3.x.toFixed(2)} ${L3.y.toFixed(2)} L${L4.x.toFixed(2)} ${L4.y.toFixed(2)} A${ring.Rin},${ring.Rin} 0 0,0 ${L1.x.toFixed(2)} ${L1.y.toFixed(2)} z`;
                    }

                    let paths = [
                        { q: "V_top", fn: (x,y) => ({x:x, y:y}) },
                        { q: "V_bottom", fn: (x,y) => ({x:-x, y:-y}) },
                        { q: "H_right", fn: (x,y) => ({x:-y, y:x}) },
                        { q: "H_left", fn: (x,y) => ({x:y, y:-x}) }
                    ];

                    paths.forEach(p => {
                        let el = document.querySelector(`#Jog${ring.id} [id^="${p.q}"] path`);
                        if(el && el.classList.contains('std')) el.setAttribute('d', buildD(p.fn));
                    });
                });
            }

            [gap100, gap10, gap1, gap01].forEach(el => {
                if(el) {
                    el.addEventListener('input', (e) => {
                        let id = e.target.id.replace('gap-', '');
                        document.getElementById('g-val-' + id).innerText = e.target.value;
                        redrawJogWedges();
                    });
                }
            });
            
            // Appel initial pour aligner le calcul CAD
            redrawJogWedges();
        }

        window.onload = init;
    </script>
</body>

</html>
