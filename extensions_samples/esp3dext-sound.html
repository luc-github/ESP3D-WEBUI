<script type="application/json" id="esp3dext-manifest">
{
  "owner": "ESP3D",
  "version": "1.0.0",
  "github": "https://github.com/luc-github/ESP3D-WEBUI",
  "description": "Plays device sounds: beep, error beep, and custom frequency/duration sequences.",
  "name": "Sound",
  "icon": "Volume2",
  "target": "panel",
  "refreshtime": "0",
  "supportedVersion": "3.*",
  "targetSystem": "*"
}
</script>
<script type="text/javascript">
  function sendMessage(msg){ 
      window.parent.postMessage(msg, '*');
  }
    
</script>

<div class="container">
    <button class="btn m-1" onclick="sendMessage({type:'sound', target:'webui', content:'beep'});">Beep</button>
    <button class="btn m-1" onclick="sendMessage({type:'sound', target:'webui', content:'error'});">Beep Error</button>
    <button class="btn m-1" onclick="sendMessage({type:'sound', target:'webui', content:'seq', seq:[{ f: 1046, d: 200 },{ f: 1318, d: 100 }]});">Beep Sequence</button>
    
</div>
