<!--
  esp3dext-helloworld.html
  Example extension using an external sidecar manifest (esp3dext-helloworld.json).
  No embedded manifest in this file — the WebUI fetches the JSON file instead.
-->
<script type="text/javascript">
  var myId = null;

  function sendMessage(msg) {
    window.parent.postMessage(msg, '*');
  }

  function queryInfo() {
    sendMessage({ type: 'capabilities', target: 'webui', id: 'hw_connection' });
    sendMessage({ type: 'capabilities', target: 'webui', id: 'hw_features', _id: 'features' });
    sendMessage({ type: 'cmd', target: 'webui', id: 'hw_cmd', content: '[ESP800]' });
  }

  function setRow(id, value, isError) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = value;
    el.className = isError ? 'text-error' : '';
  }

  function processMessage(eventMsg) {
    var d = eventMsg.data;
    if (!d || !d.type) return;

    if (d.type === 'notification') {
      myId = d.id;
      var conn = d.content && d.content.isConnected;
      setRow('row-connected', conn ? 'Yes' : 'No');
      setRow('row-ext-id', myId || '—');
      if (conn) queryInfo();
      return;
    }

    if (d.type === 'capabilities' && d.id === 'hw_connection') {
      try {
        var info = JSON.parse(d.content.response);
        setRow('row-host',     info.host      || '—');
        setRow('row-port',     info.port != null ? info.port : '—');
        setRow('row-protocol', info.wsprotocol || info.protocol || '—');
      } catch (e) {
        setRow('row-host', 'parse error', true);
      }
      return;
    }

    if (d.type === 'capabilities' && d.id === 'hw_features') {
      try {
        var feat = JSON.parse(d.content.response);
        setRow('row-target',   feat.target   || '—');
        setRow('row-fw',       feat.FWTarget || '—');
      } catch (e) { /* ignore */ }
      return;
    }

    if (d.type === 'cmd' && d.id === 'hw_cmd') {
      var resp = d.content;
      if (resp && resp.status === 'success') {
        setRow('row-esp800', resp.response || '—');
      } else {
        setRow('row-esp800', (resp && resp.error) || 'error', true);
      }
      return;
    }
  }

  window.onload = function () {
    window.addEventListener('message', processMessage, false);
  };
</script>

<div class="container">
  <h5 class="m-2">Hello World <small class="label label-secondary">sidecar manifest</small></h5>

  <table class="table table-striped">
    <tbody>
      <tr><td><strong>Extension ID</strong></td><td id="row-ext-id">—</td></tr>
      <tr><td><strong>Connected</strong></td><td id="row-connected">—</td></tr>
      <tr><td><strong>Host</strong></td><td id="row-host">—</td></tr>
      <tr><td><strong>Port</strong></td><td id="row-port">—</td></tr>
      <tr><td><strong>Protocol</strong></td><td id="row-protocol">—</td></tr>
      <tr><td><strong>Target</strong></td><td id="row-target">—</td></tr>
      <tr><td><strong>Firmware</strong></td><td id="row-fw">—</td></tr>
      <tr><td><strong>[ESP800]</strong></td><td id="row-esp800">—</td></tr>
    </tbody>
  </table>

  <button class="btn btn-primary m-1" onclick="queryInfo()">Refresh</button>
</div>
