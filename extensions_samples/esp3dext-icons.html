<script type="application/json" id="esp3dext-manifest">
{
  "owner": "ESP3D",
  "version": "1.0.0",
  "github": "https://github.com/luc-github/ESP3D-WEBUI",
  "description": "Loads and displays WebUI icons (Activity, Home, Image, File) as buttons.",
  "name": "Icons",
  "icon": "Activity",
  "target": "panel",
  "refreshtime": "0",
  "supportedVersion": "3.*",
  "targetSystem": "*"
}
</script>
<script type="text/javascript">
  const iconsToLoad = ["Activity", "Home", "Image", "File"];
  const loadedIcons = {};
  let iconsLoaded = false;

  function sendMessage(msg) {
    window.parent.postMessage(msg, '*');
  }

  function processMessage(eventMsg) {
	  console.log(eventMsg.data)
    if (!iconsLoaded) {
      if (eventMsg.data.type && eventMsg.data.id && iconsToLoad.includes(eventMsg.data.id)) {
        if (eventMsg.data.type === "icon") {
          const iconName = eventMsg.data.id;
          const iconSvg = eventMsg.data.content.response;
          loadedIcons[iconName] = iconSvg;
          console.log(`Icon ${iconName} loaded:`, iconSvg);

          if (Object.keys(loadedIcons).length === iconsToLoad.length) {
            console.log("All icons loaded.");
            useLoadedIcons();
            iconsLoaded = true;
          }
        }
      }
    }
  }

  function useLoadedIcons() {
    const buttonContainer = document.getElementById("buttonContainer");

    iconsToLoad.forEach(iconName => {
      const button = document.createElement("button");
      button.classList.add("btn", "m-1");
      button.innerHTML = loadedIcons[iconName];
      button.setAttribute("data-icon", iconName);
      button.addEventListener("click", handleButtonClick);
      buttonContainer.appendChild(button);
    });
  }

  function handleButtonClick(event) {
    const clickedIcon = event.currentTarget.getAttribute("data-icon");
    console.log(`Button clicked with icon: ${clickedIcon}`);
    // Add your button-specific action code here
  }

  function loadIcons() {
    iconsToLoad.forEach(iconName => {
      sendMessage({ type: 'icon', target: 'webui', id: iconName });
    });
  }

  window.onload = (event) => {
    window.addEventListener("message", processMessage, false);
    loadIcons();
  }
</script>

<div class="container">
  <div id="buttonContainer"></div>
</div>
